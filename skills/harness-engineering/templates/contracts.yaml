seams: []

# A seam is anything that crosses a repo boundary. It is where the harness tears, because inside one
# repo a linter can hold a line and across repos nothing does.
#
# The `verify` field is the one that does the work. A seam with no verify method is a list of things
# you hope are still true. Rubric dimension 10 scores exactly this: 2 if the seam is registered,
# 3 only if something actually checks it.
#
# kind: api-schema | shared-doc | event-name | env-var | db-schema | design-token | generated-client
#
# seams:
#   - name: user-api
#     kind: api-schema
#     owner: backend
#     consumers: [web, mobile]
#     source: api/openapi.yaml
#     verify: "npm run test:contract"
#     notes: "Consumers regenerate their client from this. Owner merges first, always."
#
#   - name: spec-documents
#     kind: shared-doc
#     owner: docs
#     consumers: [backend, e2e]
#     source: internal/specs/
#     verify: "python scripts/check_spec_refs.py"
#     notes: "e2e references these by relative path; renaming a file here breaks e2e silently."
#
#   - name: job-queue-names
#     kind: event-name
#     owner: backend
#     consumers: [worker]
#     source: app/queues.py
#     verify: "grep both sides for each literal and assert they match"
